name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CMAKE_BUILD_TYPE: Debug

jobs:
  linux:
    name: Linux (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build

    # All third-party dependencies are vendored (glfw, nvrhi, glm, entt,
    # spdlog, fmt, lua, miniaudio, stb, assimp, catch2, imgui), so only a
    # compiler and CMake are required.

    - name: Configure
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.CMAKE_BUILD_TYPE }}

    - name: Build
      run: cmake --build build --config ${{ env.CMAKE_BUILD_TYPE }}

    - name: Run tests
      run: ctest --test-dir build -C ${{ env.CMAKE_BUILD_TYPE }} --output-on-failure