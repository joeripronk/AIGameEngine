name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job builds all three configurations. Debug alone hides real problems:
# assertions and the debugbreak trap were compiled into every build because
# FG_DEBUG was defined unconditionally, so a shipped game trapped with SIGTRAP
# on an assertion failure. Release and Dist also catch optimisation- and
# NDEBUG-sensitive undefined behaviour that Debug papers over.
env:
  BUILD_TYPES: Debug,Release,Dist

jobs:
  linux:
    name: Linux (Ubuntu 24.04, ${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release, Dist]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Every package here is load-bearing, and configure fails without each one
    # rather than falling back:
    #
    #   libx11-dev      X11/Xlib.h and X11/XKBlib.h. GLFW's X11 backend is on by
    #                   default on UNIX (GLFW_BUILD_X11), and find_package(X11
    #                   REQUIRED) is what produced "Could NOT find X11".
    #   libxrandr-dev   X11/extensions/Xrandr.h    -> FATAL_ERROR otherwise
    #   libxinerama-dev X11/extensions/Xinerama.h  -> FATAL_ERROR otherwise
    #   libxcursor-dev  X11/Xcursor/Xcursor.h      -> FATAL_ERROR otherwise
    #   libxi-dev       X11/extensions/XInput.h    -> FATAL_ERROR otherwise
    #   libxext-dev     X11/extensions/shape.h     -> FATAL_ERROR otherwise
    #   libvulkan-dev   satisfies find_package(Vulkan REQUIRED) in
    #                   src/CMakeLists.txt, so the Vulkan backend can build.
    #
    # No Xvfb: ForgeTests and ForgeTetrisTests link ForgeCore, which is built
    # with FG_NO_VULKAN_RUNTIME, so no test creates a Window and nothing needs a
    # display.
    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libxext-dev \
          libvulkan-dev

    - name: Configure
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (MSVC, ${{ matrix.build_type }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release, Dist]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # The SDK is needed: src/CMakeLists.txt has find_package(Vulkan REQUIRED),
    # and without it configure dies with "Could NOT find Vulkan (missing:
    # Vulkan_LIBRARY Vulkan_INCLUDE_DIR)" even though choco reported success.
    #
    # The second step matters as much as the install. Chocolatey sets
    # VULKAN_SDK in the machine environment, but a step cannot see an
    # environment variable set by an earlier step, so the path has to be read
    # from the registry and re-exported here.
    - name: Install Vulkan SDK
      run: choco install vulkan-sdk -y --no-progress

    - name: Export Vulkan SDK path
      shell: pwsh
      run: |
        $sdk = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\SDK' -ErrorAction SilentlyContinue).VulkanSDK
        if (-not $sdk) {
          $sdk = Get-ChildItem 'C:\VulkanSDK' -Directory -ErrorAction SilentlyContinue |
                 Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
        }
        if (-not $sdk) { throw 'Vulkan SDK installed but not discoverable' }

        "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
        "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_PATH -Append
        Add-Content -Path $env:GITHUB_PATH -Value "$sdk/Bin"
        Write-Host "Vulkan SDK: $sdk"

    # Visual Studio is a multi-config generator: the configuration is selected at
    # build time with --config, and Dist has to be declared up front or CMake
    # rejects it as an unknown configuration.
    - name: Configure
      run: >
        cmake -S . -B build
        -DCMAKE_CONFIGURATION_TYPES="${{ env.BUILD_TYPES }}"

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Run tests
      run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  macos:
    name: macOS (Apple Clang, ${{ matrix.build_type }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release, Dist]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Configure failed with "Could NOT find Threads": CMake 3.31 from Homebrew
    # sits ahead of the image's own CMake on PATH, and its FindThreads probe
    # rejects Apple Clang's -pthread (CMAKE_HAVE_LIBC_PTHREAD fails, then
    # "Check if compiler accepts -pthread - no").
    #
    # Pinning CMake here matches the version Ubuntu ships and removes the
    # Homebrew build from the equation. It cannot be worked around in this
    # project: GLFW and spdlog each call find_package(Threads REQUIRED) too, so
    # dropping our own call would just move the failure.
    - name: Pin CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28.6'

    - name: Install Ninja
      run: brew install ninja

    - name: Report toolchain
      run: |
        cmake --version
        cc --version
        ninja --version
        sw_vers

    - name: Configure
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: cmake --build build -j$(sysctl -n hw.ncpu)

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

  # Memory errors that no test can observe: a use-after-free reads a plausible
  # value, so Debug and Release both pass while the engine is corrupts memory.
  # This job found two real ones - a freed PhysicsBody read for its ID, and an
  # upstream miniaudio defect on the clip-not-found path.
  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Same packages as the linux job, for the same reasons: GLFW's X11 backend
    # and find_package(Vulkan REQUIRED) both hard-fail at configure without
    # them. See the linux job for which header each one provides.
    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libxext-dev \
          libvulkan-dev

    - name: Configure
      run: >
        cmake -S . -B build -G Ninja
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
        -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

    # -j2, not -j$(nproc). assimp's IFC reader is the heaviest translation unit
    # in the project and measures 1.27 GB peak RSS on its own, 2.36 GB once ASan
    # instruments it. One job per core on a 4-core runner is therefore ~5.1 GB
    # unsanitized and ~9.4 GB sanitized; the second overruns a hosted runner and
    # the build dies with "Killed signal terminated program cc1plus", which
    # reads as a compiler crash rather than an out-of-memory one. Two jobs cap
    # the sanitized worst case near 4.8 GB. The unsanitized jobs keep full
    # parallelism, where 5.1 GB is within a hosted runner's budget.
    - name: Build
      run: cmake --build build -j2

    # Leaks are reported separately; a leak should not block a change while the
    # use-after-free class is what needs enforcing.
    - name: Run tests
      env:
        ASAN_OPTIONS: detect_leaks=0
        UBSAN_OPTIONS: print_stacktrace=1
      run: ctest --test-dir build --output-on-failure

  # The shipping configuration has to keep working, not just compile.
  deploy-dist:
    name: Distribution package (Linux)
    runs-on: ubuntu-24.04
    needs: linux
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Same packages as the linux job, for the same reasons: GLFW's X11 backend
    # and find_package(Vulkan REQUIRED) both hard-fail at configure without
    # them. See the linux job for which header each one provides.
    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libxext-dev \
          libvulkan-dev

    - name: Configure (Dist)
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Dist

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

    - name: Package
      run: tools/deploy.sh Dist

    # deploy.sh writes the archive into build/deploy/, not the repo root.
    - name: Verify the package
      run: |
        set -euo pipefail
        archive=$(ls -1 build/deploy/ForgeRuntime-linux-Dist-*.tar.gz)
        echo "Package: $archive"
        mkdir -p /tmp/pkg
        tar -xzf "$archive" -C /tmp/pkg
        test -x /tmp/pkg/linux-Dist/ForgeRuntime
        test -d /tmp/pkg/linux-Dist/resources
        test -d /tmp/pkg/linux-Dist/resources/scenes
        test -d /tmp/pkg/linux-Dist/resources/shaders
        test -f /tmp/pkg/linux-Dist/README.txt
        echo "Package contents verified."

    - uses: actions/upload-artifact@v4
      with:
        name: forge-dist-linux
        path: build/deploy/ForgeRuntime-linux-Dist-*.tar.gz