name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job builds all three configurations. Debug alone hides real problems:
# assertions and the debugbreak trap were compiled into every build because
# FG_DEBUG was defined unconditionally, so a shipped game trapped with SIGTRAP
# on an assertion failure. Release and Dist also catch optimisation- and
# NDEBUG-sensitive undefined behaviour that Debug papers over.
env:
  # ';' separated, because this is a CMake list. A comma-separated value is
  # not a list to CMake - it is a single entry named "Debug,Release,Dist".
  BUILD_TYPES: 'Debug;Release;Dist'

jobs:
  linux:
    name: Linux (Ubuntu 24.04, ${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release, Dist]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Every package here is load-bearing, and configure fails without each one
    # rather than falling back:
    #
    #   libx11-dev      X11/Xlib.h and X11/XKBlib.h. GLFW's X11 backend is on by
    #                   default on UNIX (GLFW_BUILD_X11), and find_package(X11
    #                   REQUIRED) is what produced "Could NOT find X11".
    #   libxrandr-dev   X11/extensions/Xrandr.h    -> FATAL_ERROR otherwise
    #   libxinerama-dev X11/extensions/Xinerama.h  -> FATAL_ERROR otherwise
    #   libxcursor-dev  X11/Xcursor/Xcursor.h      -> FATAL_ERROR otherwise
    #   libxi-dev       X11/extensions/XInput.h    -> FATAL_ERROR otherwise
    #   libxext-dev     X11/extensions/shape.h     -> FATAL_ERROR otherwise
    #   libvulkan-dev   satisfies find_package(Vulkan REQUIRED) in
    #                   src/CMakeLists.txt, so the Vulkan backend can build.
    #
    # No Xvfb: ForgeTests and ForgeTetrisTests link ForgeCore, which is built
    # with FG_NO_VULKAN_RUNTIME, so no test creates a Window and nothing needs a
    # display.
    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libxext-dev \
          libvulkan-dev

    - name: Configure
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (MSVC, ${{ matrix.build_type }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release, Dist]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # The SDK is needed: src/CMakeLists.txt has find_package(Vulkan REQUIRED),
    # and without it configure dies with "Could NOT find Vulkan (missing:
    # Vulkan_LIBRARY Vulkan_INCLUDE_DIR)" even though choco reported success.
    #
    # The second step matters as much as the install. Chocolatey sets
    # VULKAN_SDK in the machine environment, but a step cannot see an
    # environment variable set by an earlier step, so the path has to be read
    # from the registry and re-exported here.
    - name: Install Vulkan SDK
      run: choco install vulkan-sdk -y --no-progress

    # choco reported success on install and configure still said "Could NOT find
    # Vulkan". A step cannot see an environment variable that an earlier step
    # set, so the SDK's own VULKAN_SDK never reached Configure.
    #
    # Both lookups below are verified against the package rather than assumed:
    # choco's vulkan-sdk 1.4.363.0 installs to C:\VulkanSDK\<version> via the
    # LunarG installer, and that installer writes HKLM\SOFTWARE\Khronos\Vulkan\SDK.
    # The registry is tried first because it is what the SDK itself publishes;
    # the directory scan is the fallback, and it fails loudly rather than
    # continuing with an empty VULKAN_SDK.
    - name: Export Vulkan SDK path
      shell: pwsh
      run: |
        $sdk = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\SDK' -ErrorAction SilentlyContinue).VulkanSDK
        if (-not $sdk -or -not (Test-Path $sdk)) {
          $sdk = Get-ChildItem 'C:\VulkanSDK' -Directory -ErrorAction SilentlyContinue |
                 Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
        }
        if (-not $sdk -or -not (Test-Path $sdk)) { throw 'Vulkan SDK installed but not discoverable' }

        "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
        "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_PATH -Append
        Add-Content -Path $env:GITHUB_PATH -Value "$sdk\Bin"

        # The two paths Configure will look at. Without this the job only says
        # "not found", which does not distinguish a bad VULKAN_SDK from an SDK
        # without headers.
        Get-Item "$sdk\Include\vulkan\vulkan.h"
        Get-ChildItem "$sdk\Lib\vulkan.lib"
        Write-Host "Vulkan SDK: $sdk"

    # Visual Studio is a multi-config generator: the configuration is selected at
    # build time with --config, and Dist has to be declared up front or CMake
    # rejects it as an unknown configuration.
    # CMakeError.log / CMakeConfigureLog.yaml carry the real try_compile and
    # generator diagnostics. Without them a configure failure names a variable
    # but not the target that wanted it, which is not enough to act on - the
    # macOS Threads failure took a wrong hypothesis to diagnose otherwise.
    - name: Configure
      shell: pwsh
      run: |
        cmake -S . -B build -DCMAKE_CONFIGURATION_TYPES="${{ env.BUILD_TYPES }}"
        if ($LASTEXITCODE -ne 0) {
          Get-Content build/CMakeFiles/CMakeError.log -ErrorAction SilentlyContinue
          Get-Content build/CMakeFiles/CMakeConfigureLog.yaml -ErrorAction SilentlyContinue -Tail 60
          exit $LASTEXITCODE
        }

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Run tests
      run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  macos:
    name: macOS (Apple Clang, ${{ matrix.build_type }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release, Dist]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Pinned to the version Ubuntu ships, so all three platforms configure with
    # one CMake and Homebrew's build cannot drift underneath this job.
    #
    # This was NOT the cause of the "Could NOT find Threads" failure - 3.28.6
    # failed identically to 3.31, and the real cause was a link flag in
    # CMAKE_EXE_LINKER_FLAGS, fixed in the root CMakeLists. The pin is kept
    # because it is still worth having, not because it fixed anything.
    - name: Pin CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28.6'

    - name: Install Ninja
      run: brew install ninja

    # find_package(Vulkan REQUIRED) needs the loader library and the headers,
    # and nothing on the image provides them, so configure failed with
    # "Could NOT find Vulkan (missing: Vulkan_LIBRARY Vulkan_INCLUDE_DIR)".
    #
    # vulkan-loader pulls in vulkan-headers as a dependency, so this is the one
    # step that provides both. There is no Chocolatey equivalent and no
    # release tarball to fetch instead - Vulkan-Loader publishes no GitHub
    # releases, so a hand-built download URL here would 404 at run time.
    - name: Install Vulkan
      run: |
        set -euo pipefail
        brew install vulkan-loader
        brew --prefix vulkan-headers
        brew --prefix vulkan-loader

    - name: Report toolchain
      run: |
        cmake --version
        cc --version
        ninja --version
        sw_vers
        # The two paths configure will look at, printed so a failure says which
        # one is wrong rather than just "not found".
        ls "$(brew --prefix vulkan-headers)/include/vulkan/vulkan.h"
        ls "$(brew --prefix vulkan-loader)/lib/"libvulkan*

    # Dump the CMake logs on failure. "Could NOT find Threads" on a platform
    # whose pthreads live in libSystem named no target and no flag, so the cause
    # had to be reconstructed rather than read.
    - name: Configure
      run: |
        set -o pipefail
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          || { cat build/CMakeFiles/CMakeError.log 2>/dev/null;
               tail -n 60 build/CMakeFiles/CMakeConfigureLog.yaml 2>/dev/null;
               exit 1; }

    - name: Build
      run: cmake --build build -j$(sysctl -n hw.ncpu)

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

  # Memory errors that no test can observe: a use-after-free reads a plausible
  # value, so Debug and Release both pass while the engine is corrupts memory.
  # This job found two real ones - a freed PhysicsBody read for its ID, and an
  # upstream miniaudio defect on the clip-not-found path.
  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Same packages as the linux job, for the same reasons: GLFW's X11 backend
    # and find_package(Vulkan REQUIRED) both hard-fail at configure without
    # them. See the linux job for which header each one provides.
    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libxext-dev \
          libvulkan-dev

    - name: Configure
      run: >
        cmake -S . -B build -G Ninja
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
        -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

    # -j2, not -j$(nproc). assimp's IFC reader is the heaviest translation unit
    # in the project and measures 1.27 GB peak RSS on its own, 2.36 GB once ASan
    # instruments it. One job per core on a 4-core runner is therefore ~5.1 GB
    # unsanitized and ~9.4 GB sanitized; the second overruns a hosted runner and
    # the build dies with "Killed signal terminated program cc1plus", which
    # reads as a compiler crash rather than an out-of-memory one. Two jobs cap
    # the sanitized worst case near 4.8 GB. The unsanitized jobs keep full
    # parallelism, where 5.1 GB is within a hosted runner's budget.
    - name: Build
      run: cmake --build build -j2

    # Leaks are reported separately; a leak should not block a change while the
    # use-after-free class is what needs enforcing.
    - name: Run tests
      env:
        ASAN_OPTIONS: detect_leaks=0
        UBSAN_OPTIONS: print_stacktrace=1
      run: ctest --test-dir build --output-on-failure

  # The shipping configuration has to keep working, not just compile.
  deploy-dist:
    name: Distribution package (Linux)
    runs-on: ubuntu-24.04
    needs: linux
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # Same packages as the linux job, for the same reasons: GLFW's X11 backend
    # and find_package(Vulkan REQUIRED) both hard-fail at configure without
    # them. See the linux job for which header each one provides.
    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build \
          pkg-config \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libxext-dev \
          libvulkan-dev

    - name: Configure (Dist)
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Dist

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

    - name: Package
      run: tools/deploy.sh Dist

    # deploy.sh writes the archive into build/deploy/, not the repo root.
    - name: Verify the package
      run: |
        set -euo pipefail
        archive=$(ls -1 build/deploy/ForgeRuntime-linux-Dist-*.tar.gz)
        echo "Package: $archive"
        mkdir -p /tmp/pkg
        tar -xzf "$archive" -C /tmp/pkg
        test -x /tmp/pkg/linux-Dist/ForgeRuntime
        test -d /tmp/pkg/linux-Dist/resources
        test -d /tmp/pkg/linux-Dist/resources/scenes
        test -d /tmp/pkg/linux-Dist/resources/shaders
        test -f /tmp/pkg/linux-Dist/README.txt
        echo "Package contents verified."

    - uses: actions/upload-artifact@v4
      with:
        name: forge-dist-linux
        path: build/deploy/ForgeRuntime-linux-Dist-*.tar.gz