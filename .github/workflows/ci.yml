name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job builds all three configurations. Debug alone hides real problems:
# assertions and the debugbreak trap were compiled into every build because
# FG_DEBUG was defined unconditionally, so a shipped game trapped with SIGTRAP
# on an assertion failure. Release and Dist also catch optimisation- and
# NDEBUG-sensitive undefined behaviour that Debug papers over.
env:
  BUILD_TYPES: Debug,Release,Dist

jobs:
  linux:
    name: Linux (Ubuntu 24.04, ${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release, Dist]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build

    - name: Configure
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (MSVC, ${{ matrix.build_type }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release, Dist]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Vulkan SDK
      run: |
        choco install vulkan-sdk -y --no-progress

    # Visual Studio is a multi-config generator: the configuration is selected at
    # build time with --config, and Dist has to be declared up front or CMake
    # rejects it as an unknown configuration.
    - name: Configure
      run: >
        cmake -S . -B build
        -DCMAKE_CONFIGURATION_TYPES="${{ env.BUILD_TYPES }}"

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Run tests
      run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

  macos:
    name: macOS (Apple Clang, ${{ matrix.build_type }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release, Dist]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: cmake --build build -j$(sysctl -n hw.ncpu)

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

  # Memory errors that no test can observe: a use-after-free reads a plausible
  # value, so Debug and Release both pass while the engine is corrupts memory.
  # This job found two real ones - a freed PhysicsBody read for its ID, and an
  # upstream miniaudio defect on the clip-not-found path.
  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build

    - name: Configure
      run: >
        cmake -S . -B build -G Ninja
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
        -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

    - name: Build
      run: cmake --build build -j$(nproc)

    # Leaks are reported separately; a leak should not block a change while the
    # use-after-free class is what needs enforcing.
    - name: Run tests
      env:
        ASAN_OPTIONS: detect_leaks=0
        UBSAN_OPTIONS: print_stacktrace=1
      run: ctest --test-dir build --output-on-failure

  # The shipping configuration has to keep working, not just compile.
  deploy-dist:
    name: Distribution package (Linux)
    runs-on: ubuntu-24.04
    needs: linux
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          ninja-build

    - name: Configure (Dist)
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Dist

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

    - name: Package
      run: tools/deploy.sh Dist

    # deploy.sh writes the archive into build/deploy/, not the repo root.
    - name: Verify the package
      run: |
        set -euo pipefail
        archive=$(ls -1 build/deploy/ForgeRuntime-linux-Dist-*.tar.gz)
        echo "Package: $archive"
        mkdir -p /tmp/pkg
        tar -xzf "$archive" -C /tmp/pkg
        test -x /tmp/pkg/linux-Dist/ForgeRuntime
        test -d /tmp/pkg/linux-Dist/resources
        test -d /tmp/pkg/linux-Dist/resources/scenes
        test -d /tmp/pkg/linux-Dist/resources/shaders
        test -f /tmp/pkg/linux-Dist/README.txt
        echo "Package contents verified."

    - uses: actions/upload-artifact@v4
      with:
        name: forge-dist-linux
        path: build/deploy/ForgeRuntime-linux-Dist-*.tar.gz